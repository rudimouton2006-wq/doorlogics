<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- ⚡️ PERFORMANCE: DNS Preconnects to speed up external asset resolution -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- ⚡️ PERFORMANCE: Critical Render Path Override -->
    <!-- Forces the browser to download the fonts instantly in parallel, bypassing the CSS @import bottleneck -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" />
    </noscript>

    <!-- Standard Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png">
    
    <!-- Mobile Optimization & Native App Feel -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Expert garage door and gate automation. Reliable service since 1991 across the Western Cape." />
    <meta name="keywords" content="Doorlogics, Garage Doors, Gate Automation, Fencing, Bellville, Cape Town" />
    <meta name="author" content="Takumi Tech" />
    
    <!-- Brand Colors -->
    <meta name="theme-color" content="#1A1A1A" />
    
    <title>Doorlogics | Expert Gate & Garage Automation</title>

    <!-- ⚡️ PERFORMANCE: Instant First Contentful Paint (FCP) -->
    <!-- This completely eliminates the "White Flash" before React boots up -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #FAFAFA; /* Matches brand-surface light mode */
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
    </style>
  </head>
  <body>
    <noscript>
      <div style="padding: 20px; text-align: center; font-family: sans-serif; color: #1A1A1A;">
        <strong>JavaScript is required to run Doorlogics.</strong><br />
        Please enable JavaScript in your browser settings to view our portfolio and book services.
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
